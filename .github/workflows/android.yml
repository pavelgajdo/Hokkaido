# Builds the Hokkaido Android app (arm64 APK) on every push and on demand.
name: Fusion Android

on:
  push:
    branches: [fusion-0.3.52]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2* /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "cmake;3.31.5" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install build tools
        # Runner package mirrors fail now and then (exit code 100): retry before failing a release.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y ccache glslang-tools ninja-build; then
              exit 0
            fi
            echo "apt-get failed (attempt $attempt); retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: android-ccache-${{ github.sha }}
          restore-keys: android-ccache-

      - name: Restore CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/cpm
          key: android-cpm-${{ hashFiles('cpmfile.json', 'externals/cpmfile.json', 'src/**/cpmfile.json') }}
          restore-keys: android-cpm-

      - name: Sync Banana Native preview
        run: |
          URL=https://git.eden-emu.dev/moceure/BananaNative/releases/download/v0.3.52-preview/banana-native-v0.3.52-preview.apk
          curl --fail --location --retry 3 "$URL" -o /tmp/banana.apk
          echo 'cf5fef4d6fb5529aceef769c4e8877df728c5822077f5e6c422601def69a0e4a  /tmp/banana.apk' | sha256sum -c -
          git clone --depth 1 --branch v0.3.52-preview https://git.eden-emu.dev/moceure/BananaNative.git /tmp/banana-source
          bash tools/android/sync_bananative.sh /tmp/banana-source v0.3.52-preview /tmp/banana.apk "$URL"
          sed -i 's/applicationId = "dev.lichii.android"/applicationId = "dev.lichii.fusion"/; s/"appNameBase" to "Hokkaido"/"appNameBase" to "Hokkaido Fusion"/' src/android/app/build.gradle.kts

      - name: Build APK
        env:
          CCACHE: "true"
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t standard -b Release

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hokkaido-android-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error

