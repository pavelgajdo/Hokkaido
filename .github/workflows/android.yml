# Builds the Hokkaido Android app (arm64 APK) on every push and on demand.
name: android

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2* /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install build tools
        # Runner package mirrors fail now and then (exit code 100): retry before failing a release.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y ccache glslang-tools ninja-build; then
              exit 0
            fi
            echo "apt-get failed (attempt $attempt); retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: android-ccache-${{ github.sha }}
          restore-keys: android-ccache-

      - name: Restore CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/cpm
          key: android-cpm-${{ hashFiles('cpmfile.json', 'externals/cpmfile.json', 'src/**/cpmfile.json') }}
          restore-keys: android-cpm-

      - name: Build APK
        env:
          CCACHE: "true"
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t standard -b Release

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hokkaido-android-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Read release version
        if: startsWith(github.ref, 'refs/tags/android-') && github.ref != 'refs/tags/android-latest'
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#android-}" >> "$GITHUB_ENV"

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/android-') && github.ref != 'refs/tags/android-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hokkaido ${{ env.RELEASE_VERSION }}
          prerelease: false
          make_latest: true
          body_path: docs/android/RELEASE_NOTES.md
          files: artifacts/*.apk

      - name: Publish test release for phone download
        if: github.ref == 'refs/heads/nx2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Hokkaido test build
          prerelease: true
          make_latest: false
          body: Automatic test build from ${{ github.sha }}. Experimental.
          files: artifacts/*.apk

      # A test/<name> branch publishes its APK as the pre-release android-test-<name>, for testers
      # to try one fix without a push to nx2.
      - name: Read test branch name
        if: startsWith(github.ref, 'refs/heads/test/')
        run: echo "TEST_NAME=${GITHUB_REF_NAME#test/}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Publish branch test release
        if: startsWith(github.ref, 'refs/heads/test/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-${{ env.TEST_NAME }}
          target_commitish: ${{ github.sha }}
          name: "Hokkaido test: ${{ env.TEST_NAME }}"
          prerelease: true
          make_latest: false
          body: Test build of branch ${{ github.ref_name }} at ${{ github.sha }}. For testing one fix; not a release.
          files: artifacts/*.apk
