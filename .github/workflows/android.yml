name: Fusion Android

on:
  push:
    branches: [fusion-0.3.52]
  workflow_dispatch:

concurrency:
  group: fusion-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
      BANANA_EXPECTED_COMMIT: a15d676bab584acc1f139af78a7efb16bc361454
      BANANA_EXPECTED_APK_SHA256: cf5fef4d6fb5529aceef769c4e8877df728c5822077f5e6c422601def69a0e4a
      GIT_TAG_NAME: 0.7.1-fusion.0.3.52-preview.2
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check synchronization scripts
        run: |
          bash -n tools/android/sync_bananative.sh
          python3 -m py_compile tools/android/extract_banana_buildconfig.py tools/android/verify_fusion_apk.py tools/android/check_fusion_locales.py
          python3 -m unittest discover -s tools/android -p 'test_*.py' -v

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2* /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android toolchain
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "cmake;3.31.5" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "DEXDUMP=$ANDROID_HOME/build-tools/36.0.0/dexdump" >> "$GITHUB_ENV"

      - name: Install native build tools
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y ccache glslang-tools ninja-build binutils; then
              exit 0
            fi
            echo "apt-get attempt $attempt failed; retrying in 20 seconds"
            sleep 20
          done
          exit 1

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: fusion-android-ccache-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fusion-android-ccache-${{ github.sha }}-
            fusion-android-ccache-
            android-ccache-

      - name: Restore native dependencies
        id: dependency-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/cpm
          key: android-cpm-${{ hashFiles('cpmfile.json', 'externals/cpmfile.json', 'src/**/cpmfile.json') }}
          restore-keys: android-cpm-

      - name: Synchronize and verify Banana Native preview
        run: |
          url=https://git.eden-emu.dev/moceure/BananaNative/releases/download/v0.3.52-preview/banana-native-v0.3.52-preview.apk
          apk="$RUNNER_TEMP/banana-native-v0.3.52-preview.apk"
          source_dir="$RUNNER_TEMP/banana-native-source"
          curl --fail --location --retry 3 "$url" -o "$apk"
          git clone --depth 1 --branch v0.3.52-preview https://git.eden-emu.dev/moceure/BananaNative.git "$source_dir"
          bash tools/android/sync_bananative.sh "$source_dir" v0.3.52-preview "$apk" "$url"
          echo "BANANA_APK=$apk" >> "$GITHUB_ENV"
          mkdir -p artifacts
          cp src/android/banana/UPSTREAM.txt artifacts/Banana-UPSTREAM.txt
          git diff --binary -- src/android/banana/upstream src/android/banana/buildconfig.txt src/android/banana/UPSTREAM.txt > artifacts/banana-source-sync.patch

      - name: Verify Chinese translations after source synchronization
        run: |
          python3 tools/android/check_fusion_locales.py --json artifacts/fusion-language-coverage.json

      - name: Configure native dependencies and SDL Java sources
        id: configure-native
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew ':app:configureCMakeRelWithDebInfo[arm64-v8a]' \
            --no-daemon --stacktrace --max-workers=2 \
            -PYUZU_ANDROID_ARGS="-DUSE_CCACHE=ON -DENABLE_UPDATE_CHECKER=OFF -DCMAKE_JOB_POOLS=fusion_compile=2 -DCMAKE_JOB_POOL_COMPILE=fusion_compile" \
            -Pnightly=false 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/cmake-configure.log"
          test -f "$GITHUB_WORKSPACE/externals/generated/sdl/java/org/libsdl/app/SDL.java"

      - name: Compile Java and Kotlin integration
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :banana:compileReleaseJavaWithJavac :app:compileMainlineReleaseKotlin :app:processMainlineReleaseManifest \
            --no-daemon --stacktrace --max-workers=2 \
            -PYUZU_ANDROID_ARGS="-DUSE_CCACHE=ON -DENABLE_UPDATE_CHECKER=OFF -DCMAKE_JOB_POOLS=fusion_compile=2 -DCMAKE_JOB_POOL_COMPILE=fusion_compile" \
            -Pnightly=false 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/frontend-build.log"

      - name: Check release lint before native compilation
        working-directory: src/android
        run: |
          ./gradlew :app:lintVitalMainlineRelease --no-daemon --stacktrace --max-workers=2 \
            -PYUZU_ANDROID_ARGS="-DUSE_CCACHE=ON -DENABLE_UPDATE_CHECKER=OFF -DCMAKE_JOB_POOLS=fusion_compile=2 -DCMAKE_JOB_POOL_COMPILE=fusion_compile" \
            -Pnightly=false 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/release-lint.log"

      - name: Build Fusion APK
        id: apk-build
        working-directory: src/android
        run: |
          ccache --zero-stats
          ./gradlew :app:assembleMainlineRelease --no-daemon --stacktrace --max-workers=2 \
            -PYUZU_ANDROID_ARGS="-DUSE_CCACHE=ON -DENABLE_UPDATE_CHECKER=OFF -DCMAKE_JOB_POOLS=fusion_compile=2 -DCMAKE_JOB_POOL_COMPILE=fusion_compile" \
            -Pnightly=false 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/apk-build.log"

      - name: Report compiler cache after compilation
        if: ${{ !cancelled() && (steps.apk-build.outcome == 'success' || steps.apk-build.outcome == 'failure') }}
        continue-on-error: true
        run: ccache --show-stats --verbose | tee artifacts/ccache-stats.txt

      - name: Save compiler cache after attempted compilation
        if: ${{ !cancelled() && (steps.apk-build.outcome == 'success' || steps.apk-build.outcome == 'failure') && steps.compiler-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Save native dependencies
        if: ${{ !cancelled() && steps.configure-native.outcome == 'success' && steps.dependency-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.cache/cpm
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}

      - name: Verify signature and retain signed APK
        id: signed
        run: |
          built=src/android/app/build/outputs/apk/mainline/release/app-mainline-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$built" > artifacts/apk-signature.txt
          cp "$built" artifacts/Hokkaido-Fusion-0.3.52-preview.2.apk
          (cd artifacts && sha256sum Hokkaido-Fusion-0.3.52-preview.2.apk > SHA256SUMS.txt)

      - name: Verify APK identity and native libraries
        id: payload
        run: |
          built=artifacts/Hokkaido-Fusion-0.3.52-preview.2.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$built" > artifacts/apk-badging.txt
          python3 tools/android/verify_fusion_apk.py "$built" "$BANANA_APK" artifacts/apk-badging.txt | tee artifacts/apk-payload-verification.txt
          echo '### Fusion APK built and verified' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the APK artifact below. Device installation and gameplay still need testing.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve signed candidate if payload verification fails
        if: failure() && steps.signed.outcome == 'success' && steps.payload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Hokkaido-Fusion-SIGNED-CANDIDATE-NOT-FULLY-VERIFIED-${{ github.run_number }}
          path: |
            artifacts/Hokkaido-Fusion-0.3.52-preview.2.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Hokkaido-Fusion-APK-${{ github.run_number }}
          path: |
            artifacts/Hokkaido-Fusion-0.3.52-preview.2.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hokkaido-Fusion-diagnostics-${{ github.run_number }}
          path: |
            artifacts/*.log
            artifacts/*.txt
            artifacts/*.patch
            artifacts/*.json
          if-no-files-found: ignore
          retention-days: 14
